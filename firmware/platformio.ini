; PlatformIO project for the SR04 float-in-pipe bench characterization.
; Board: ESP32-WROOM-32U DevKit  ->  PlatformIO board id "esp32dev".

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; OTA needs two app partitions (ota_0 / ota_1) to flash the new image beside the
; running one. default.csv provides both (~1.25 MB each) and is already the esp32dev
; default — pinned here so a future scheme change can't silently break OTA.
board_build.partitions = default.csv

monitor_speed = 115200   ; matches Serial.begin(115200) in the sketch
upload_speed = 921600    ; drop to 115200 if uploads fail

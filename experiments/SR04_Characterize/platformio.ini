; PlatformIO project for the SR04 float-in-pipe bench characterization.
; Board: ESP32-WROOM-32U DevKit  ->  PlatformIO board id "esp32dev".

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200   ; matches Serial.begin(115200) in the sketch
upload_speed = 921600    ; drop to 115200 if uploads fail
